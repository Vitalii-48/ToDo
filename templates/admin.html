<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адміністратор</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h2>Список користувачів</h2>
    <ol class="admin-users">
        {% for user in users %}
            <li class="admin-user-card">
                <div class="admin-user-header">
                    <div class="admin-user-title">
                        <h3>Користувач {{ user[1] }}</h3>
                        <span class="user-role">user</span>
                    </div>
                    <form action="{{ url_for('admin_delete_user', user_id=user[0]) }}" method="POST">
                        <button type="submit" class="button-danger-outline">Видалити користувача</button>
                    </form>
                </div>

                <h3>Задачі користувача</h3>
                <ol class="admin-task-list">
                    {% for task in tasks.get(user[0], []) %}
                        <li>
                            <span>{{ task[2] }}</span>
                            <form action="{{ url_for('admin_delete_task', task_id=task[0]) }}" method="POST">
                                <button type="submit" class="button-danger-outline">Видалити задачу</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="empty-tasks">Задач поки немає</li>
                    {% endfor %}
                </ol>
            </li>
        {% endfor %}
    </ol>
</body>
</html>
